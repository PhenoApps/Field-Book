[versions]
kotlin-plugin-compose = "2.3.10" # same as main app build.gradle
compose = "1.7.3" # compatible with compileSdk = 34
multiplatform-settings = "1.3.0"
lifecycle-viewmodel-compose = "2.8.4" # compatible with compose
navigation-compose = "2.8.0-alpha11" # aligned with Compose Multiplatform 1.7.3
kotlinx-datetime = "0.6.2" # When upgrading, see https://github.com/Kotlin/kotlinx-datetime?tab=readme-ov-file#deprecation-of-instant
kotlinx-serialization = "2.3.10" # same as main app build.gradle
kotlinx-serialization-json = "1.8.1"
okio = "2.2.0"
filekit = "0.8.8" # compatible with compileSdk = 34
ktor = "3.1.3"
coil = "3.0.0" # compatible with compileSdk = 34
reorderable = "3.0.0"
kotlinx-serialization-csv = "0.0.21"
openapi-generator = "7.22.0"
lazytable = "1.10.0"
compass = "1.2.4"
ksensor = "2.0.4"
kmp-zip = "0.8.0"

[libraries]
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings-no-arg", version.ref = "multiplatform-settings" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle-viewmodel-compose" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
permissions = { module = "dev.icerock.moko:permissions", version = "0.20.1" }
permissions-camera = { module = "dev.icerock.moko:permissions-camera", version = "0.20.1" }
permissions-compose = { module = "dev.icerock.moko:permissions-compose", version = "0.20.1" }
permissions-location = { module = "dev.icerock.moko:permissions-location", version = "0.20.1" }
permissions-microphone = { module = "dev.icerock.moko:permissions-microphone", version = "0.20.1" }
filekit-core = { module = "io.github.vinceglb:filekit-core", version.ref = "filekit" }
filekit-compose = { module = "io.github.vinceglb:filekit-compose", version.ref = "filekit" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
kotlinx-serialization-csv = { module = "app.softwork:kotlinx-serialization-csv", version.ref = "kotlinx-serialization-csv" }
lazytable = { module = "io.github.oleksandrbalan:lazytable", version.ref = "lazytable" }
compass-geolocation = { module = "dev.jordond.compass:geolocation", version.ref = "compass" }
compass-geolocation-mobile = { module = "dev.jordond.compass:geolocation-mobile", version.ref = "compass" }
ksensor = { module = "io.github.shadmanadman:KSensor", version.ref = "ksensor" }
kmp-zip = { module = "no.synth:kmp-zip", version.ref = "kmp-zip" }

[plugins]
app-cash-sqldelight = { id = "app.cash.sqldelight", version = "2.1.0" }
kotlin-plugin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin-plugin-compose" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinx-serialization" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
