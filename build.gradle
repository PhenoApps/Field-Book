// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.3'
        classpath 'com.google.gms:google-services:4.4.3'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.6'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.10"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:2.9.3"
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.56.2'
    }
}

plugins {
    id 'com.google.dagger.hilt.android' version '2.56.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.10' apply false
    id "org.jetbrains.kotlin.plugin.compose" version "2.2.10"
    id 'org.jetbrains.kotlin.kapt' version '2.2.10' apply false
    id 'com.google.devtools.ksp' version '2.2.10-2.0.2' apply false
    id("org.jetbrains.kotlin.plugin.serialization") version "2.2.10" apply false
    // 13.x is the last line that does not require AGP 9
    id 'com.mikepenz.aboutlibraries.plugin.android' version '13.2.1' apply false
    id 'io.github.takahirom.roborazzi' version '1.43.1' apply false
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven { url "https://jitpack.io" }
        maven { url 'https://raw.github.com/saki4510t/libcommon/master/repository/' }
    }
}

tasks.register('recordTreeUiScreenshots') {
    group = 'documentation'
    description = 'Record integrated tree UI PNGs into trait-tree/screenshots/integrated/ (docs-only; not part of testDebugUnitTest).'
    dependsOn ':app:publishTreeIntegratedScreenshots'
}

tasks.register('verifyTreeUiScreenshots') {
    group = 'verification'
    description = 'Verify integrated tree UI screenshot goldens only (docs-only; not full unit suite).'
    doLast {
        // Scope to TreeIntegratedScreenshotTest — verifyRoborazziDebug alone OOMs / runs too broad.
        exec {
            executable = './gradlew'
            args = [
                ':app:testDebugUnitTest',
                '-PincludeTreeScreenshots',
                '-Proborazzi.test.verify=true',
                '--tests', 'com.fieldbook.tracker.screenshots.TreeIntegratedScreenshotTest',
            ]
            workingDir = rootDir
        }
    }
}

ext {
    extTruthVersion = "1.7.0"
    coreVersion = "1.7.0"
    testRulesVersion = "1.7.0"
    extJUnitVersion = "1.3.0"
    runnerVersion = "1.6.2"
    espressoVersion = "3.7.0"
}